
name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push da imagem
        run: |
          docker build --build-arg VITE_API_URL=http://3.215.146.171 -t brucilao/horticontrol-frontend:latest .
          docker push brucilao/horticontrol-frontend:latest
          
          # docker build -t brucilao/horticontrol-frontend:latest .
          # docker push brucilao/horticontrol-frontend:latest

      - name: Deploy via Bastion
        uses: appleboy/ssh-action@v1
        with:
          host: 3.215.146.171
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Para e remove o container antigo se ele já existir
            docker stop horticontrol-frontend || true
            docker rm horticontrol-frontend || true
            
            # 2. Baixa a versão mais recente que você acabou de buildar
            docker pull brucilao/horticontrol-frontend:latest
            
            # 3. Roda o container mapeando a porta 8084 da EC2 para a porta 80 interna do container
            docker run -d --name horticontrol-frontend -p 8084:80 --restart always brucilao/horticontrol-frontend:latest
            
            # cd ~/projeto && docker compose pull frontend && docker compose up -d frontend nginx

